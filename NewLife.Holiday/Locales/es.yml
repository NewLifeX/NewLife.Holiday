# Español 词表（es）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"NewLife.Holiday - Chinese Holiday Library": "NewLife.Holiday - Biblioteca de días festivos de China"
"Chinese holiday and adjusted-workday identification library with built-in annual holiday data and lunar festival support. Works fully offline and supports .NET Framework 4.5, .NET Standard 2.0/2.1 and modern .NET.": "Biblioteca de identificación de días festivos y jornadas de ajuste de China, con datos anuales integrados y compatibilidad con festividades del calendario lunar. Funciona totalmente sin conexión y es compatible con .NET Framework 4.5, .NET Standard 2.0/2.1 y .NET moderno."
"The date is outside the supported lunar calendar range.": "La fecha está fuera del rango admitido del calendario lunar."

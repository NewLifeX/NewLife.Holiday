name: aot

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]
  workflow_dispatch:

jobs:
  # NativeAOT 冒烟矩阵：NativeAOT 官方不支持跨 OS 编译，每个 RID 用原生 runner 发布运行。
  # win-x64 / linux-x64 / linux-arm64 为阻断门禁；LA64（linux-loongarch64，必选覆盖）见本文件末尾 job。
  # 同一冒烟工程先以运行时模式跑一遍（JIT 对照），再 NativeAOT 发布运行，任一场景失败即非 0 退出码。
  aot:
    name: aot (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            bin: AotSmoke.exe
          - rid: linux-x64
            os: ubuntu-latest
            bin: AotSmoke
          - rid: linux-arm64
            os: ubuntu-24.04-arm
            bin: AotSmoke

    steps:
    - uses: actions/checkout@v4
    - name: Set TimeZone (Windows)
      if: runner.os == 'Windows'
      run: tzutil /s "China Standard Time"
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x
    - name: Install NativeAOT Prerequisites (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
    - name: JIT Baseline
      # 同一冒烟工程以运行时模式运行（16 场景），为 NativeAOT 结果提供对照
      env:
        TZ: Asia/Shanghai
      run: dotnet run -c Release --project AotSmoke/AotSmoke.csproj
    - name: Publish NativeAOT Smoke
      env:
        TZ: Asia/Shanghai
      run: dotnet publish AotSmoke/AotSmoke.csproj -c Release -r ${{ matrix.rid }} -o AotSmoke/bin/aot-out
    - name: Run NativeAOT Smoke
      env:
        TZ: Asia/Shanghai
      shell: bash
      run: ./AotSmoke/bin/aot-out/${{ matrix.bin }}

  # LoongArch64（linux-loongarch64，必选覆盖）：官方无 runner、运行时无原生 runner 分发；
  # 方案：docker + QEMU 用户态仿真（loong64 binfmt）+ 龙芯 SDK 在 loong64 容器内以 LA64 运行时运行冒烟程序
  #（JIT 模式，主信号，阻断门禁）；NativeAOT 原生编译为探索步骤（continue-on-error）：
  # 宿主 x64 ILCompiler 无 LA64 后端；容器内以龙芯 SDK 尝试 publish -r linux-loongarch64（已配置 lnuget 源），
  # 官方支持到位后即可将探索步骤转为阻断。
  # QEMU 用户态对 LASX/LSX 指令覆盖不全，关闭硬件内建（DOTNET_EnableHWIntrinsic=0）避免非法指令崩溃。
  loongarch64:
    name: aot (linux-la64 qemu)
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET (host, for restore)
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x
    - name: Set up QEMU (loong64)
      uses: docker/setup-qemu-action@v3
      with:
        platforms: loong64
    - name: Download Loongson .NET SDK (linux-loongarch64)
      run: |
        curl -fL -o "$HOME/la64-sdk.tar.gz" \
          https://github.com/loongson/dotnet/releases/download/v10.0.113-loongarch64/dotnet-sdk-10.0.113-linux-loongarch64.tar.gz
        mkdir -p "$HOME/la64" && tar -xzf "$HOME/la64-sdk.tar.gz" -C "$HOME/la64"
        chmod +x "$HOME/la64/dotnet" || true
    - name: Restore & Build AotSmoke (host x64 SDK)
      # 龙芯 SDK 在 QEMU 下的 MSBuild 链路不稳，还原与构建均放宿主 x64 SDK（产出 RID 无关 IL），
      # 容器内仅以 LA64 运行时执行；包目录保持 $HOME/.nuget/packages 同路径挂载
      run: |
        dotnet restore AotSmoke/AotSmoke.csproj
        dotnet build AotSmoke/AotSmoke.csproj -c Release --no-restore
    - name: JIT Smoke in loong64 Container (16 场景)
      run: |
        docker run --rm --platform linux/loong64 \
          -v "$PWD:/src" -w /src \
          -v "$HOME/la64:/opt/dotnet" \
          -v "$HOME/.nuget/packages:/home/runner/.nuget/packages" \
          -e NUGET_PACKAGES=/home/runner/.nuget/packages \
          -e DOTNET_ROOT=/opt/dotnet \
          -e DOTNET_CLI_TELEMETRY_OPTOUT=1 \
          -e DOTNET_EnableHWIntrinsic=0 \
          -e TZ=Asia/Shanghai \
          lcr.loongnix.cn/debian:14-slim \
          sh -c '
            set -e
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends tzdata libicu-dev libssl-dev >/dev/null
            /opt/dotnet/dotnet --info
            /opt/dotnet/dotnet /src/AotSmoke/bin/Release/net10.0/AotSmoke.dll
          '
    - name: NativeAOT Publish (linux-loongarch64, 探索)
      # 基准镜像未含 libicu，dotnet CLI 启动即 FailFast（Couldn't find a valid ICU package）；
      # 与首个容器一致补装，确保失败信号来自 ILCompiler 支持面而非环境缺失
      continue-on-error: true
      run: |
        docker run --rm --platform linux/loong64 \
          -v "$PWD:/src" -w /src \
          -v "$HOME/la64:/opt/dotnet" \
          -v "$HOME/.nuget/packages:/home/runner/.nuget/packages" \
          -e NUGET_PACKAGES=/home/runner/.nuget/packages \
          -e DOTNET_ROOT=/opt/dotnet \
          -e DOTNET_CLI_TELEMETRY_OPTOUT=1 \
          lcr.loongnix.cn/debian:14-slim \
          sh -c '
            set -e
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends clang zlib1g-dev libicu-dev >/dev/null
            /opt/dotnet/dotnet nuget add source -n lnuget https://lnuget.loongnix.cn/v3/index.json || true
            /opt/dotnet/dotnet publish /src/AotSmoke/AotSmoke.csproj -c Release -r linux-loongarch64 -o /src/AotSmoke/bin/aot-out-la64
          '
    - name: Run NativeAOT Smoke (linux-loongarch64, 探索)
      continue-on-error: true
      run: |
        if [ -x AotSmoke/bin/aot-out-la64/AotSmoke ]; then
          # NativeAOT 运行时默认依赖 ICU 与 tzdata，容器内补装后再执行
          docker run --rm --platform linux/loong64 \
            -v "$PWD:/src" -w /src \
            -e TZ=Asia/Shanghai \
            lcr.loongnix.cn/debian:14-slim \
            sh -c '
              set -e
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends tzdata libicu-dev >/dev/null
              ./AotSmoke/bin/aot-out-la64/AotSmoke
            '
        else
          echo "未产出 linux-loongarch64 原生可执行文件（NativeAOT 尚未支持 LA64），跳过运行"
        fi

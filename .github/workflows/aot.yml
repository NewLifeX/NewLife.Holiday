name: aot

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]
  workflow_dispatch:

jobs:
  # NativeAOT 冒烟矩阵：NativeAOT 官方不支持跨 OS 编译，每个 RID 用原生 runner 发布运行。
  # 同一冒烟工程先以运行时模式跑一遍（JIT 对照），再 NativeAOT 发布运行，任一场景失败即非 0 退出码。
  # 非阻塞策略（2026-10-17 决策）：AOT 冒烟为兼容性参考信号，环境/工具链问题失败时不阻塞主分支。
  aot:
    name: aot (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            bin: AotSmoke.exe
          - rid: linux-x64
            os: ubuntu-latest
            bin: AotSmoke
          - rid: linux-arm64
            os: ubuntu-24.04-arm
            bin: AotSmoke

    steps:
    - uses: actions/checkout@v4
    - name: Set TimeZone (Windows)
      if: runner.os == 'Windows'
      run: tzutil /s "China Standard Time"
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x
    - name: Install NativeAOT Prerequisites (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
    - name: JIT Baseline
      # 同一冒烟工程以运行时模式运行（16 场景），为 NativeAOT 结果提供对照
      env:
        TZ: Asia/Shanghai
      run: dotnet run -c Release --project AotSmoke/AotSmoke.csproj
    - name: Publish NativeAOT Smoke
      env:
        TZ: Asia/Shanghai
      run: dotnet publish AotSmoke/AotSmoke.csproj -c Release -r ${{ matrix.rid }} -o AotSmoke/bin/aot-out
    - name: Run NativeAOT Smoke
      env:
        TZ: Asia/Shanghai
      shell: bash
      run: ./AotSmoke/bin/aot-out/${{ matrix.bin }}

  # LoongArch64（linux-loongarch64，必选覆盖）：官方无 runner、运行时无原生 runner 分发；
  # 方案：docker + QEMU 用户态仿真（loong64 binfmt）+ 龙芯 SDK 在 loong64 容器内以 LA64 运行时运行冒烟程序
  #（JIT 模式，主信号，阻断门禁）。
  # NativeAOT 原生编译（探索步骤，continue-on-error）：跨 OS 原生编译不被官方支持，LA64 原生编译只能在容器内进行。
  # 龙芯已随 SDK 发布完整 LA64 NativeAOT 工具链（lnuget 提供 runtime.linux-loongarch64.Microsoft.DotNet.ILCompiler 与
  # NativeAOT 运行时包），管线已推进到“容器内仅执行 ilc 与链接”，但 QEMU 下龙芯运行时的反射 InvokeStub 存在缺陷：
  # MSBuild 任务属性赋值会随代码路径随机触发 NRE/内存破坏（RemoveDuplicates/CombineTargetFrameworkInfoProperties/
  # csc 动态正则等），不同轮次命中最先执行的任务，仓库侧无法修复；官方 SDK 修复该缺陷后可将探索步骤转为阻断门禁。
  # QEMU 用户态对 LASX/LSX 指令覆盖不全，关闭硬件内建（DOTNET_EnableHWIntrinsic=0）避免非法指令崩溃。
  # 非阻塞策略（2026-10-17 决策）：LA64 与 AOT 均为兼容性参考信号，环境问题失败时不阻塞主分支（可跳过）。
  loongarch64:
    name: aot (linux-la64 qemu)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    continue-on-error: true

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET (host, for restore)
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x
    - name: Set up QEMU (loong64)
      uses: docker/setup-qemu-action@v3
      with:
        platforms: loong64
    - name: Download Loongson .NET SDK (linux-loongarch64)
      run: |
        curl -fL -o "$HOME/la64-sdk.tar.gz" \
          https://github.com/loongson/dotnet/releases/download/v10.0.113-loongarch64/dotnet-sdk-10.0.113-linux-loongarch64.tar.gz
        mkdir -p "$HOME/la64" && tar -xzf "$HOME/la64-sdk.tar.gz" -C "$HOME/la64"
        chmod +x "$HOME/la64/dotnet" || true
    - name: Restore & Build AotSmoke (host x64 SDK)
      # 龙芯 SDK 在 QEMU 下的 MSBuild 链路不稳，还原与构建均放宿主 x64 SDK（产出 RID 无关 IL），
      # 容器内仅以 LA64 运行时执行；包目录保持 $HOME/.nuget/packages 同路径挂载
      run: |
        dotnet restore AotSmoke/AotSmoke.csproj
        dotnet build AotSmoke/AotSmoke.csproj -c Release --no-restore
    - name: JIT Smoke in loong64 Container (16 场景)
      run: |
        docker run --rm --platform linux/loong64 \
          -v "$PWD:/src" -w /src \
          -v "$HOME/la64:/opt/dotnet" \
          -v "$HOME/.nuget/packages:/home/runner/.nuget/packages" \
          -e NUGET_PACKAGES=/home/runner/.nuget/packages \
          -e DOTNET_ROOT=/opt/dotnet \
          -e DOTNET_CLI_TELEMETRY_OPTOUT=1 \
          -e DOTNET_EnableHWIntrinsic=0 \
          -e TZ=Asia/Shanghai \
          lcr.loongnix.cn/debian:14-slim \
          sh -c '
            set -e
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends tzdata libicu-dev libssl-dev >/dev/null
            /opt/dotnet/dotnet --info
            /opt/dotnet/dotnet /src/AotSmoke/bin/Release/net10.0/AotSmoke.dll
          '
    - name: Restore for linux-loongarch64 & 容器构建所需包 (host x64 SDK)
      # 容器内不能跑 NuGet 还原（QEMU 下 RemoveDuplicates NRE），全部预还原到 $HOME/.nuget/packages 后挂载进容器：
      # 1) 目标 RID 运行时包：lnuget 提供 linux-loongarch64 运行时包（其服务索引含 HTTP 终结点，需 allowInsecureConnections）；
      # 2) NativeAOT 宿主包 runtime.linux-loongarch64.Microsoft.DotNet.ILCompiler（龙芯随 SDK 版本 10.0.13 提供，含 LA64 原生 ilc）；
      # 3) 容器 SDK 未自带的目标包（NETSDK1127）：NETStandard.Library.Ref（netstandard2.1）等，宿主 SDK 自带故还原不会自动下载。
      run: |
        cat > "$HOME/lnuget.config" <<'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <configuration>
          <packageSources>
            <clear />
            <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            <add key="lnuget" value="https://lnuget.loongnix.cn/v3/index.json" allowInsecureConnections="true" />
          </packageSources>
          <config>
            <!-- lnuget 大包下载偶发响应截断，降低单源并发以提升稳定性 -->
            <add key="maxHttpRequestsPerSource" value="2" />
          </config>
        </configuration>
        EOF
        dotnet restore AotSmoke/AotSmoke.csproj -r linux-loongarch64 --configfile "$HOME/lnuget.config"

        mkdir -p /tmp/ilcpck
        cat > /tmp/ilcpck/ilcpck.csproj <<'EOF'
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup>
            <TargetFramework>net10.0</TargetFramework>
          </PropertyGroup>
          <ItemGroup>
            <PackageDownload Include="runtime.linux-loongarch64.Microsoft.DotNet.ILCompiler" Version="[10.0.13]" />
            <PackageDownload Include="NETStandard.Library.Ref" Version="[2.1.0]" />
            <PackageDownload Include="NETStandard.Library" Version="[2.0.3]" />
            <PackageDownload Include="Microsoft.NETCore.App.Ref" Version="[10.0.13]" />
          </ItemGroup>
        </Project>
        EOF
        dotnet restore /tmp/ilcpck/ilcpck.csproj --configfile "$HOME/lnuget.config"
    - name: Build AotSmoke IL for linux-loongarch64 (host x64 SDK)
      # 托管编译放宿主：容器内 csc 执行编译期动态生成的正则方法会在 QEMU 下 FailFast（Roslyn 崩溃）；
      # 宿主产出 RID 相关纯 IL 与 apphost，容器内 publish --no-build 只跑 ilc 原生编译与链接
      run: dotnet build AotSmoke/AotSmoke.csproj -c Release -r linux-loongarch64 --no-restore
    - name: NativeAOT Publish (linux-loongarch64, 探索)
      # 管线：宿主完成还原与托管编译，容器内只跑 ilc（LA64 原生工具）与 clang 链接，绕开 QEMU 下的 NuGet 还原与 Roslyn 编译；
      # 当前剩余阻塞（2026-10-16 实测）：QEMU 下龙芯运行时的反射 InvokeStub 缺陷令 MSBuild 任务属性赋值随机 NRE/内存破坏
      #（RemoveDuplicates/CombineTargetFrameworkInfoProperties/csc 动态正则……随代码路径变化），需官方 SDK 修复。
      # BuildProjectReferences=false + _GetChildProjectCopyToPublishDirectoryItems=false：跳过对类库 P2P 的发布项收集
      #（类库无 content 项，跳过安全；--no-build 不会自动关闭该调用，会踩 MSB4057）；
      # 基准镜像未含 libicu，dotnet CLI 启动即 FailFast，需补装；
      # DOTNET_EnableHWIntrinsic=0：QEMU 用户态对 LASX/LSX 指令覆盖不全，关闭硬件内建避免非法指令崩溃；
      # DOTNET_ReadyToRun=0 + DOTNET_TieredCompilation=0：强制全 JIT，减少 R2R 预编译代码在 QEMU 下的风险面；
      # DOTNET_CLI_USE_MSBUILD_SERVER=0 + -m:1/-nodeReuse:false：收敛为进程内单节点构建，避免服务端/工作节点进程在仿真下崩溃；
      # ilc 为 LA64 原生工具，QEMU 下编译耗时较长，加超时兜底。
      continue-on-error: true
      run: |
        docker run --rm --platform linux/loong64 \
          -v "$PWD:/src" -w /src \
          -v "$HOME/la64:/opt/dotnet" \
          -v "$HOME/.nuget/packages:/home/runner/.nuget/packages" \
          -e NUGET_PACKAGES=/home/runner/.nuget/packages \
          -e DOTNET_ROOT=/opt/dotnet \
          -e DOTNET_CLI_TELEMETRY_OPTOUT=1 \
          -e DOTNET_EnableHWIntrinsic=0 \
          -e DOTNET_ReadyToRun=0 \
          -e DOTNET_TieredCompilation=0 \
          -e DOTNET_CLI_USE_MSBUILD_SERVER=0 \
          -e MSBUILDDISABLENODEREUSE=1 \
          lcr.loongnix.cn/debian:14-slim \
          sh -c '
            set -e
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends clang zlib1g-dev libicu-dev >/dev/null
            timeout 150m /opt/dotnet/dotnet publish /src/AotSmoke/AotSmoke.csproj -c Release -r linux-loongarch64 --no-build --no-restore --disable-build-servers -p:BuildProjectReferences=false -p:_GetChildProjectCopyToPublishDirectoryItems=false -m:1 -nodeReuse:false -o /src/AotSmoke/bin/aot-out-la64
          '
    - name: Run NativeAOT Smoke (linux-loongarch64, 探索)
      continue-on-error: true
      run: |
        if [ -x AotSmoke/bin/aot-out-la64/AotSmoke ]; then
          # NativeAOT 运行时默认依赖 ICU 与 tzdata，容器内补装后再执行
          docker run --rm --platform linux/loong64 \
            -v "$PWD:/src" -w /src \
            -e TZ=Asia/Shanghai \
            lcr.loongnix.cn/debian:14-slim \
            sh -c '
              set -e
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends tzdata libicu-dev >/dev/null
              ./AotSmoke/bin/aot-out-la64/AotSmoke
            '
        else
          echo "未产出 linux-loongarch64 原生可执行文件，跳过运行（发布为探索步骤）"
        fi
